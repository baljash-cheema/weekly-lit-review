name: Weekly literature review

# Runs every Friday morning and emails the review, aiming to land by 7:30 am Central.
# GitHub schedules are in UTC and do not follow daylight saving, and GitHub sometimes
# starts scheduled jobs late or skips them altogether (it skipped both on 2026-11-13).
# So there are several entries through the morning, and the gate step lets exactly one
# of them do the work: the first that starts at or after 6:50 am in Chicago on a day
# whose review has not been saved to archive/ yet. The rest stop within seconds.
#
# To run it by hand: GitHub -> Actions -> Weekly literature review -> Run workflow.

on:
  schedule:
    - cron: "55 11 * * 5"   # 6:55 am Central in daylight time (too early in winter; skipped)
    - cron: "55 12 * * 5"   # 6:55 am Central in standard time; backup in summer
    - cron: "25 13 * * 5"   # backup
    - cron: "55 13 * * 5"   # backup
    - cron: "55 14 * * 5"   # backup
    - cron: "55 16 * * 5"   # last backup (late morning Central)
  workflow_dispatch:
    inputs:
      days:
        description: "Days to look back"
        default: "7"
      send_email:
        description: "Email the report"
        type: boolean
        default: true
      archive:
        description: "Save the PDF and slides to the repository"
        type: boolean
        default: true

permissions:
  contents: write  # to save each week's PDF into archive/
  actions: write   # only used by the keep-alive step below

# One run at a time, so a backup that starts while the main run is still working waits
# and then sees the saved review instead of sending a second email.
concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # GitHub switches off schedules in public repositories after 60 days without
      # activity. Re-enabling the workflow on each scheduled run resets that clock.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly-review.yml/enable"

      - uses: actions/checkout@v4

      # Scheduled runs only. Manual runs always go ahead.
      - name: Decide whether this run should do the work
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            now=$(TZ=America/Chicago date +%H%M)
            today=$(date -u +%F)   # same clock curate.py uses to date the report
            saved="archive/${today%%-*}/weekly-review-$today.pdf"
            if [ "$((10#$now))" -lt 650 ]; then
              echo "It is $now in Chicago, before 6:50 am. Leaving it to the next entry."
              run=false
            elif [ -f "$saved" ]; then
              echo "Today's review is already saved ($saved). Nothing to do."
              run=false
            fi
          fi
          echo "run: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Collect this week's candidates from PubMed
        if: steps.gate.outputs.run == 'true'
        run: python collect.py --days "${{ inputs.days || '7' }}"

      - name: Select and write up with Claude
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python curate.py

      # One plain slide per full write-up in the sections named under `slides` in
      # config.yaml. No file is produced in a week with none.
      - name: Build the slide deck
        if: steps.gate.outputs.run == 'true'
        run: python make_slides.py

      - name: Email the report
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.send_email)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_EMAIL_TO: ${{ secrets.REVIEW_EMAIL_TO }}
        run: python send_email.py reports/review_*.md --attach $(ls slides/*/review-slides-*.pptx 2>/dev/null | tail -1)

      # Print the same formatted page the email uses to a PDF and commit it, so every
      # week's review stays in the repository under archive/<year>/. The slide deck, when
      # there is one, is committed alongside under slides/<year>/.
      - name: Save the PDF and slides to the repository
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.archive)
        run: |
          report=$(ls reports/review_*.md | head -1)
          day=$(basename "$report" .md | sed 's/^review_//')
          out="archive/${day%%-*}/weekly-review-$day.pdf"
          mkdir -p "$(dirname "$out")"
          python send_email.py "$report" --html "$RUNNER_TEMP/review.html"
          chrome=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          "$chrome" --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$out" "file://$RUNNER_TEMP/review.html"
          test -s "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          if [ -d slides ]; then git add slides; fi
          git commit -m "Archive weekly review $day" || echo "No change to archive"
          git pull --rebase --quiet
          git push

      - name: Keep a copy of the report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.run_id }}
          path: reports/review_*.md
          if-no-files-found: ignore
          retention-days: 90
